name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# AWS Academy: credenciais de sessão temporárias (expiram com o Lab), não
# suporta OIDC nem IAM role de longa duração — ver README > "AWS Academy".
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Empacotar AuthFunction
        run: |
          mkdir -p artifacts
          dotnet publish src/AuthFunction/AuthFunction.csproj -c Release -o publish/auth
          cd publish/auth && zip -r ../../artifacts/auth-function.zip . && cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: artifacts/*.zip
          retention-days: 7

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: artifacts

      # AWS Academy reseta a conta entre sessões — bucket/tabela do backend
      # remoto do Terraform (compartilhado entre infra-k8s/infra-database/
      # lambda) podem não existir ainda. Idempotente: só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate-augusto"
          TABLE="soat-tech-challenge-tfstate-lock-augusto"

          # || true: outro repo (infra-k8s/infra-database) pode estar criando o
          # mesmo bucket/tabela ao mesmo tempo — o create falha com "already
          # exists"/"ResourceInUseException", mas o wait abaixo garante que
          # seguimos só depois do recurso existir de verdade, não importa quem criou.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 || true
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled || true
          fi
          aws s3api wait bucket-exists --bucket "$BUCKET"

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 || true
          fi
          aws dynamodb wait table-exists --table-name "$TABLE" --region us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - working-directory: infra
        run: terraform init -input=false

      - working-directory: infra
        run: terraform fmt -check -recursive

      - working-directory: infra
        run: terraform validate

      - working-directory: infra
        run: |
          terraform plan -input=false -no-color \
            -var="lab_role_arn=${{ secrets.AWS_LAB_ROLE_ARN }}" \
            -var="auth_function_zip=../artifacts/auth-function.zip"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: producao
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: artifacts

      # AWS Academy reseta a conta entre sessões — bucket/tabela do backend
      # remoto do Terraform (compartilhado entre infra-k8s/infra-database/
      # lambda) podem não existir ainda. Idempotente: só cria o que faltar.
      - name: Bootstrap do backend remoto (S3 + DynamoDB)
        run: |
          BUCKET="soat-tech-challenge-tfstate-augusto"
          TABLE="soat-tech-challenge-tfstate-lock-augusto"

          # || true: outro repo (infra-k8s/infra-database) pode estar criando o
          # mesmo bucket/tabela ao mesmo tempo — o create falha com "already
          # exists"/"ResourceInUseException", mas o wait abaixo garante que
          # seguimos só depois do recurso existir de verdade, não importa quem criou.
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1 || true
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true || true
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled || true
          fi
          aws s3api wait bucket-exists --bucket "$BUCKET"

          if ! aws dynamodb describe-table --table-name "$TABLE" --region us-east-1 >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region us-east-1 || true
          fi
          aws dynamodb wait table-exists --table-name "$TABLE" --region us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - working-directory: infra
        run: terraform init -input=false

      - working-directory: infra
        run: |
          terraform apply -auto-approve -input=false \
            -var="lab_role_arn=${{ secrets.AWS_LAB_ROLE_ARN }}" \
            -var="auth_function_zip=../artifacts/auth-function.zip"
